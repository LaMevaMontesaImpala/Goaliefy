<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goaliefy | Pro Goalkeeper Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        apple: {
                            bg: '#000000',
                            card: '#161617',
                            border: '#333336',
                            textPrimary: '#f5f5f7',
                            textSecondary: '#86868b',
                            accent: '#2997ff'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap');
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background-color: #000000;
            color: #f5f5f7;
            -webkit-font-smoothing: antialiased;
        }
        .glass-panel {
            background: rgba(22, 22, 23, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .indicator-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-apple-accent selection:text-white">

    <!-- Header -->
    <header class="w-full border-b border-apple-border px-6 py-4 flex items-center justify-between glass-panel sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <svg class="w-8 h-8" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M16 4L6 8V15C6 21.5 10.3 27.5 16 30C21.7 27.5 26 21.5 26 15V8L16 4Z" fill="#2997ff"/>
                <path d="M20 14C19.2 12.2 17.7 11 16 11C13.2 11 11 13.2 11 16C11 18.8 13.2 21 16 21C18.8 21 21 18.8 21 16H16" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="text-xl font-semibold tracking-tight text-white">Goaliefy</span>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-xs px-3 py-1 rounded-full bg-apple-border text-apple-textSecondary font-medium">Performance Evaluation</span>
        </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8 space-y-8">
        
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold tracking-tight text-white">Qualitative Video Assessment</h1>
            <p class="text-apple-textSecondary text-sm max-w-lg mx-auto">Upload footage, use the telestrator to break down the play, and review core execution indicators without relying on estimated metrics.</p>
        </div>

        <!-- Upload & Player Section -->
        <div class="glass-panel rounded-2xl p-6 border border-apple-border relative overflow-hidden" id="upload-container">
            
            <div id="drop-zone" class="border-2 border-dashed border-apple-border rounded-xl p-12 text-center flex flex-col items-center justify-center cursor-pointer min-h-[260px] bg-black/40 hover:border-apple-accent hover:bg-apple-card transition-all w-full">
                <div class="pointer-events-none flex flex-col items-center">
                    <svg class="w-12 h-12 text-apple-textSecondary mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p class="text-base font-medium text-white mb-1">Drag & drop video here, or <span class="text-apple-accent underline">browse files</span></p>
                    <p class="text-xs text-apple-textSecondary">MP4, MOV, M4V</p>
                </div>
                <input type="file" id="video-upload" accept="video/*" class="hidden">
            </div>

            <!-- Video Player & Precision Controls -->
            <div id="player-container" class="hidden space-y-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                        <span id="file-name" class="text-xs font-medium text-apple-textSecondary truncate max-w-[200px] md:max-w-xs"></span>
                    </div>
                    <button id="btn-reset" class="text-xs text-apple-textSecondary hover:text-white transition-colors underline cursor-pointer z-50">
                        Upload Next Video
                    </button>
                </div>

                <div class="relative rounded-xl overflow-hidden bg-black aspect-video border border-apple-border shadow-2xl flex flex-col items-center justify-center" id="video-wrapper">
                    <video id="video-preview" controls playsinline preload="auto" class="w-full h-full object-contain"></video>
                    <canvas id="annotation-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-10 touch-none"></canvas>
                </div>

                <div class="flex flex-wrap items-center justify-center p-3 bg-black/60 border border-apple-border rounded-xl gap-4">
                    <div class="flex items-center space-x-2">
                        <span class="text-[10px] text-apple-textSecondary uppercase tracking-wider">Speed</span>
                        <button class="speed-btn px-2 py-1 text-xs rounded bg-apple-card text-white hover:bg-apple-border transition" data-speed="0.25">0.25x</button>
                        <button class="speed-btn px-2 py-1 text-xs rounded bg-apple-card text-white hover:bg-apple-border transition" data-speed="0.5">0.5x</button>
                        <button class="speed-btn px-2 py-1 text-xs rounded bg-apple-accent text-white hover:bg-blue-600 transition" data-speed="1">1.0x</button>
                    </div>
                    
                    <div class="h-6 w-px bg-apple-border hidden sm:block"></div>
                    
                    <div class="flex items-center space-x-2">
                        <span class="text-[10px] text-apple-textSecondary uppercase tracking-wider">Frame</span>
                        <button id="btn-frame-prev" class="px-3 py-1 text-xs rounded bg-apple-card text-white hover:bg-apple-border transition flex items-center space-x-1">
                            <span>-1</span>
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <button id="btn-frame-next" class="px-3 py-1 text-xs rounded bg-apple-card text-white hover:bg-apple-border transition flex items-center space-x-1">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            <span>+1</span>
                        </button>
                    </div>

                    <div class="h-6 w-px bg-apple-border hidden sm:block"></div>

                    <div class="flex items-center space-x-2">
                        <span class="text-[10px] text-apple-textSecondary uppercase tracking-wider">Analyze</span>
                        <button id="btn-draw" class="px-3 py-1 text-xs rounded bg-apple-card text-white hover:bg-apple-border transition flex items-center space-x-1" title="Toggle Tactical Drawing">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0
