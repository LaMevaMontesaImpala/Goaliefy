<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goaliefy | Local Debug</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        .glass { background: rgba(22, 22, 23, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen p-6 flex flex-col items-center">

    <div class="max-w-xl w-full space-y-6">
        <h1 class="text-2xl font-bold text-center">Goaliefy - Entorno de Pruebas Local</h1>
        
        <!-- Input API Key -->
        <div class="glass p-4 rounded-xl space-y-2">
            <label class="text-xs text-gray-400 block">Google Gemini API Key:</label>
            <input type="password" id="api-key" placeholder="Pega tu clave aquí..." class="w-full bg-black border border-gray-700 rounded p-2 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>

        <!-- Input Video -->
        <div class="glass p-6 rounded-xl text-center space-y-4">
            <input type="file" id="video-file" accept="video/mp4,video/quicktime,video/*" class="text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer">
            
            <div id="player-box" class="hidden space-y-4">
                <video id="local-video" controls playsinline class="w-full rounded-lg bg-black aspect-video object-contain border border-gray-800"></video>
                <button id="btn-test-ai" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg text-sm transition">
                    Probar Extracción y Análisis con Gemini
                </button>
            </div>
        </div>

        <!-- Consola de depuración visual -->
        <div class="glass p-4 rounded-xl space-y-2">
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Consola de Estado:</h2>
            <div id="debug-log" class="bg-black/80 p-3 rounded font-mono text-xs text-green-400 h-32 overflow-y-auto space-y-1">
                [Sistema listo. Sube un vídeo MP4.]
            </div>
        </div>
    </div>

    <script>
        const logBox = document.getElementById('debug-log');
        function log(msg) {
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `<div>[${time}] ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
            console.log(msg);
        }

        const videoInput = document.getElementById('video-file');
        const videoElement = document.getElementById('local-video');
        const playerBox = document.getElementById('player-box');
        const btnTestAI = document.getElementById('btn-test-ai');
        const apiKeyInput = document.getElementById('api-key');

        videoInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (!file) return;

            log(`Archivo seleccionado: ${file.name} (${(file.size / (1024*1024)).toFixed(2)} MB, tipo: ${file.type})`);

            // Crear Blob URL seguro
            try {
                const fileURL = URL.createObjectURL(file);
                videoElement.src = fileURL;
                videoElement.load();
                playerBox.classList.remove('hidden');
                log("Reproductor inicializado correctamente con URL de objeto.");
            } catch (err) {
                log(`ERROR al crear URL de objeto: ${err.message}`);
            }
        });

        videoElement.onerror = function() {
            log("ERROR NATIVO DEL REPRODUCTOR: El navegador no pudo decodificar este archivo de vídeo.");
        };

        videoElement.onloadeddata = function() {
            log(`Vídeo cargado con éxito. Duración: ${videoElement.duration.toFixed(1)}s | Resolución: ${videoElement.videoWidth}x${videoElement.videoHeight}`);
        };

        btnTestAI.addEventListener('click', async () => {
            const key = apiKeyInput.value.trim();
            if (!key) {
                alert("Introduce la API Key primero.");
                return;
            }
            if (!videoElement.videoWidth) {
                alert("El vídeo aún no ha cargado los metadatos.");
                return;
            }

            log("Iniciando extracción de fotograma en Canvas...");
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 640;
                canvas.height = (videoElement.videoHeight / videoElement.videoWidth) * 640;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                
                const base64Data = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
                log("Fotograma extraído a Base64 correctamente.");

                log("Enviando petición POST a Gemini 1.5 Flash...");
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Describe brevemente este fotograma y clasifica la acción deportiva en una frase corta." },
                                { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                            ]
                        }]
                    })
                });

                if (!response.ok) {
                    const errJson = await response.json().catch(() => ({}));
                    throw new Error(`HTTP ${response.status}: ${errJson?.error?.message || 'Error desconocido en la API'}`);
                }

                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;
                log(`¡ÉXITO DE IA! Respuesta recibida: "${aiText.trim()}"`);

            } catch (err) {
                log(`ERROR EN LA PETICIÓN AI: ${err.message}`);
            }
        });
    </script>
</body>
</html>
